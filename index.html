<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VSI Music</title>
<style>
  :root { --bg: #fbfbfa; --ink: #2a2a2a; --faint: #9a9a96; --hair: #e7e6e3; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141414; --ink: #e8e8e6; --faint: #8a8a86; --hair: #2a2a2a; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 300 15px/1.8 "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 64px 20px; }
  h1 { font-weight: 300; font-size: 22px; letter-spacing: .08em; margin: 0 0 4px; }
  .rule { height: 1px; margin: 16px 0 28px; background: linear-gradient(90deg, #ff7aa8, #ffc46b, #7be0a8, #6bb8ff, #b48cff); opacity: .7; }
  p { color: var(--faint); margin: 0 0 24px; }
  a.item { display: block; padding: 14px 0; border-bottom: 1px solid var(--hair); color: var(--ink); text-decoration: none; }
  a.item small { display: block; color: var(--faint); font-size: 13px; }
  a.item:hover { padding-left: 6px; transition: padding .3s; }
</style>
</head>
<body>
<main>
  <h1>VSI Music</h1>
  <div class="rule"></div>
  <p>意味（情景・感情・動き）を重ね合わせて、音楽をその場で作り続ける実験的なエンジン。音はすべてブラウザの中で生成されます。</p>

  <a class="item" href="docs/09_research.md">研究ノート<small>仮想音源推定（VSI）理論と、意味の重ね合わせ</small></a>
</main>
</body>
</html>
