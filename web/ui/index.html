<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resonance Field</title>
<style>
  :root { --bg: #fbfbfa; --ink: #2a2a2a; --faint: #b9b9b6; --hair: #e7e6e3; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font: 300 12px/1.5 "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; letter-spacing: 0.04em; -webkit-font-smoothing: antialiased; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  .glyph { position: fixed; z-index: 3; background: none; border: 0; color: var(--faint); font: inherit; font-size: 15px; cursor: pointer; padding: 10px; transition: color .4s; }
  .glyph:hover { color: var(--ink); }
  #detailBtn { top: 6px; right: 8px; z-index: 7; } /* 開いた詳細の上にも出して、もう一度押せば閉じる */
  #like { bottom: 8px; right: 52px; } #dislike { bottom: 8px; right: 12px; }
  #wordBtn { bottom: 8px; left: 50%; transform: translateX(-50%); font-size: 12px; }
  /* 情景語は 1 行にして横にスクロール（狭い画面で平面に被らないように） */
  #scenes { position: fixed; z-index: 3; top: 10px; left: 12px; right: 76px; display: flex; flex-wrap: nowrap; gap: 14px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; padding: 2px 0 6px;
    mask-image: linear-gradient(90deg, #000 85%, transparent); -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); }
  #scenes::-webkit-scrollbar { display: none; }
  #scenes button { flex: none; }
  #scenes button { background: none; border: 0; padding: 2px 0; font: inherit; color: var(--faint); cursor: pointer; border-bottom: 0.5px solid transparent; transition: color .4s; }
  #scenes button:hover { color: var(--ink); }
  #scenes button.on { color: var(--ink); border-image: linear-gradient(90deg, #ff7aa8, #ffc46b, #7be0a8, #6bb8ff, #b48cff) 1; }
  @media (max-width: 600px) { #scenes { font-size: 11px; gap: 12px; } .glyph { padding: 8px; } }
  #word { position: fixed; z-index: 4; bottom: 46px; left: 50%; transform: translateX(-50%); width: min(420px, calc(100% - 32px));
    border: 0; border-bottom: 0.5px solid var(--ink); background: transparent; font: inherit; font-size: 14px; text-align: center; padding: 6px; outline: none; display: none; color: var(--ink); }
  #card { position: fixed; z-index: 4; left: 50%; bottom: 90px; transform: translateX(-50%); width: min(560px, calc(100% - 32px)); padding: 10px 14px; border: 0.5px solid var(--hair);
    border-radius: 10px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); font-size: 11px; line-height: 1.8; color: var(--ink); opacity: 0; transition: opacity .8s; pointer-events: none; }
  #card small { color: var(--faint); }
  #toast { position: fixed; z-index: 4; bottom: 78px; left: 50%; transform: translateX(-50%); color: var(--faint); font-size: 11px; transition: opacity .8s; pointer-events: none; text-align: center; max-width: calc(100% - 32px); }
  #panel { position: fixed; z-index: 5; top: 0; right: 0; bottom: 0; width: min(340px, 100%); background: color-mix(in srgb, var(--bg) 94%, transparent);
    backdrop-filter: blur(8px); border-left: 0.5px solid var(--hair); transform: translateX(100%); transition: transform .5s cubic-bezier(.2,.7,.2,1); overflow-y: auto; padding: 48px 20px 24px; }
  #panel.open { transform: none; }
  #panel h2 { font-weight: 400; font-size: 11px; color: var(--faint); margin: 18px 0 6px; letter-spacing: .12em; }
  .row { display: grid; grid-template-columns: 64px 1fr 34px; align-items: center; gap: 8px; margin: 2px 0; }
  .row span:last-child { text-align: right; color: var(--faint); font-variant-numeric: tabular-nums; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 14px; background: transparent; }
  input[type=range]::-webkit-slider-runnable-track { height: 0.5px; background: var(--faint); }
  input[type=range]::-moz-range-track { height: 0.5px; background: var(--faint); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 9px; height: 9px; border-radius: 50%; background: var(--bg); border: 0.5px solid var(--ink); margin-top: -4.5px; }
  input[type=range]::-moz-range-thumb { width: 9px; height: 9px; border-radius: 50%; background: var(--bg); border: 0.5px solid var(--ink); }
  .tin { width: 100%; box-sizing: border-box; border: 0; border-bottom: 0.5px solid var(--hair); background: transparent; font: inherit; font-size: 12px; padding: 5px 0; color: var(--ink); outline: none; margin-bottom: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; } .chips button { background: none; border: 0.5px solid var(--hair); border-radius: 12px; padding: 2px 10px; font: inherit; color: var(--ink); cursor: pointer; } .chips button.on { border-color: var(--ink); }
  #readout { white-space: pre-wrap; color: var(--ink); font-size: 11px; line-height: 1.7; }
  #panel button.small { background: none; border: 0.5px solid var(--hair); border-radius: 12px; padding: 3px 12px; font: inherit; color: var(--ink); cursor: pointer; margin-top: 10px; }
  /* 無限メドレー: いつも見える ∞ と、開いてしばらくだけ浮かぶ案内 */
  #medleyGlyph { bottom: 8px; left: 12px; font-size: 17px; }
  #medleyGlyph.on { color: var(--ink); border-bottom: 0.5px solid; border-image: linear-gradient(90deg, #ff7aa8, #ffc46b, #7be0a8, #6bb8ff, #b48cff) 1; animation: breathe 3s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .55; } }
  #medleyFloat { position: fixed; z-index: 4; left: 12px; bottom: 54px; display: flex; align-items: center; gap: 2px; max-width: calc(100% - 24px);
    background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(6px); border: 0.5px solid var(--hair); border-radius: 20px; padding: 2px 4px 2px 2px;
    box-shadow: 0 4px 18px rgba(0,0,0,.05); opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .8s, transform .8s; }
  #medleyFloat.show { opacity: 1; transform: none; pointer-events: auto; }
  #medleyFloat::before { content: ''; position: absolute; inset: -0.5px; border-radius: 20px; padding: 0.5px; pointer-events: none;
    background: linear-gradient(90deg, #ff7aa8, #ffc46b, #7be0a8, #6bb8ff, #b48cff); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: .7; }
  #medleyFloat button { background: none; border: 0; font: inherit; color: var(--ink); cursor: pointer; padding: 8px 10px; text-align: left; }
  #medleyFloat small { color: var(--faint); }
  #medleyFloatX { color: var(--faint) !important; padding: 8px 10px !important; }
  .chips button .del { margin-left: 6px; color: var(--faint); } .chips button .del:hover { color: var(--ink); }
  #intro { position: fixed; z-index: 6; inset: 0; display: grid; place-items: center; pointer-events: none; color: var(--faint); font-size: 11px; letter-spacing: .3em; transition: opacity 1.2s; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="scenes"></div>
<button class="glyph" id="detailBtn" title="詳細">≡</button>
<button class="glyph" id="like" title="好き">♡</button>
<button class="glyph" id="dislike" title="違う">✕</button>
<button class="glyph" id="medleyGlyph" title="無限メドレー">∞</button>
<div id="medleyFloat"><button id="medleyFloatGo">∞ 無限メドレーを聴く <small>名曲の主題が、場面を変えながら流れ続けます</small></button><button id="medleyFloatX" title="閉じる">×</button></div>
<button class="glyph" id="wordBtn" title="言葉で（/ キー）">· · ·</button>
<input id="word" placeholder="ことばで" autocomplete="off">
<div id="toast"></div>
<div id="card"></div>
<div id="intro">tap to begin</div>
<aside id="panel">
  <h2>プリセット</h2><div id="presets" class="chips"></div>
  <input id="presetName" class="tin" placeholder="いまの状態に名前をつけて保存（このブラウザだけ）" style="margin-top:8px">
  <button class="small" id="presetSave" style="margin-top:2px">いまを保存</button>
  <h2>いま</h2><div id="readout">—</div>
  <h2>テーマ（主題）</h2>
  <select id="themePick" class="tin"><option value="">著作権の切れた主題から選ぶ…</option></select>
  <button class="small" id="medleyBtn">∞ 無限メドレー</button> <span id="medleyNow" style="font-size:11px;color:var(--faint)"></span>
  <input id="themeMel" class="tin" placeholder="旋律 例: 1 2 3 5 | 6 5 3 - | 4 3 2 1 | 2 - - -">
  <input id="themeChd" class="tin" placeholder="和音 例: I V vi IV">
  <button class="small" id="themeSet">テーマを使う</button> <button class="small" id="themeOff">外す</button>
  <h2>様式（マナー）</h2><div id="manners" class="chips"></div>
  <h2>世界</h2><div id="world"></div>
  <h2>地（和声）</h2><div id="ground"></div>
  <h2>図（旋律）</h2><div id="figure"></div>
  <button class="small" id="release">手動を解除</button>
  <button class="small" id="export">記録を書き出す</button>
</aside>
<script type="module" src="./app.js"></script>
</body>
</html>
