<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Walk</title>
<style>
  html, body { margin: 0; height: 100%; background: #fbfbfa; overflow: hidden; font: 300 12px/1.5 "Hiragino Sans", system-ui, sans-serif; color: #2a2a2a; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  #hud { position: fixed; left: 14px; bottom: 12px; font-size: 11px; color: #777; white-space: pre; pointer-events: none; }
  #api { position: fixed; right: 14px; bottom: 12px; font: 11px/1.6 ui-monospace, Menlo, monospace; color: #888; white-space: pre; text-align: right; pointer-events: none; max-width: 60vw; overflow: hidden; }
  #help { position: fixed; left: 14px; top: 12px; font-size: 11px; color: #999; pointer-events: none; }
  #start { position: fixed; inset: 0; display: grid; place-items: center; color: #999; letter-spacing: .3em; cursor: pointer; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="help">WASD / 矢印で歩く　スペースで灯りを放つ（影を祓う）</div>
<div id="hud"></div>
<div id="api"></div>
<div id="start">click to begin</div>
<script type="module" src="./game.js"></script>
</body>
</html>
