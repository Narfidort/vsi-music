<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Walk</title>
<style>
  html, body { margin: 0; height: 100%; background: #fbfbfa; overflow: hidden; font: 300 12px/1.5 "Hiragino Sans", system-ui, sans-serif; color: #2a2a2a; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #hud { position: fixed; left: 14px; bottom: 12px; font-size: 11px; color: #777; white-space: pre; pointer-events: none; }
  #api { position: fixed; right: 14px; bottom: 12px; font: 11px/1.6 ui-monospace, Menlo, monospace; color: #888; white-space: pre; text-align: right; pointer-events: none; max-width: 60vw; overflow: hidden; }
  #help { position: fixed; left: 14px; top: 12px; font-size: 11px; color: #999; pointer-events: none; }
  #start { position: fixed; inset: 0; display: grid; place-items: center; color: #999; letter-spacing: .3em; cursor: pointer; z-index: 5; background: #fbfbfa; }
  /* タッチ用の灯ボタン */
  #burst { position: fixed; right: 18px; bottom: 96px; width: 64px; height: 64px; border-radius: 50%; border: 0.8px solid #c9b8ff; background: rgba(255,255,255,0.7);
    color: #6a5cff; font: 300 15px "Hiragino Sans", system-ui; display: none; touch-action: none; -webkit-tap-highlight-color: transparent; box-shadow: 0 3px 12px rgba(80,60,160,0.12); }
  @media (pointer: coarse) { #burst { display: block; } }
  @media (max-width: 700px) {
    #api { font-size: 9px; line-height: 1.45; max-width: 64vw; bottom: 172px; right: 10px; white-space: pre-wrap; word-break: break-all; } /* 長い命令は折り返す */
    #hud { font-size: 10px; left: 10px; bottom: 10px; }
    #help { font-size: 10px; left: 10px; top: 8px; right: 10px; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="help">WASD / 矢印で歩く　スペースで灯りを放つ（影を祓う）</div>
<button id="burst">灯</button>
<div id="hud"></div>
<div id="api"></div>
<div id="start">tap to begin</div>
<script type="module" src="./game.js"></script>
</body>
</html>
